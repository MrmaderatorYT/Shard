plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.ccs.shard'
    compileSdk 36

    defaultConfig {
        applicationId "com.ccs.shard"
        minSdk 21
        targetSdk 36
        versionCode 6
        versionName "1.0.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Ship only the languages the app is actually translated into. Pulling in
        // every AndroidX translation roughly doubles the resource table for no
        // benefit, and APK size matters most on the low-end devices we target.
        resourceConfigurations += ["en", "uk"]

        // Render vectors at build time on API < 21 instead of shipping PNGs.
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep debug builds fast to iterate on; shrinking is a release concern.
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.kotlin_module", "DebugProbesKt.bin",
                         "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    lint {
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    // Only the auth half of Play Services: tokens for the Drive REST calls,
    // which Shard makes itself over HttpURLConnection. Pulling in
    // google-api-services-drive instead would add megabytes and reflection.
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    // Last Java 8 maintenance line of JGit.  It remains compatible with the
    // app's API 21 / Java 8 baseline and includes the 5.13.5 security fixes.
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r'
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    baselineProfile project(':benchmark')
}
